<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tarot Card Reader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>List of Cards</h1>
    <p>Test Run of Python/CSV connection</p>

    <table>
        <thead>
            <tr>
                <th>Card Name</th>
            </tr>
        </thead>
        <tbody>
            {% for card in tarot_cards %}
            <tr>
                <td>{{ card.card_name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
